name: exam-app

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-exam_app}
      POSTGRES_USER: ${POSTGRES_USER:-exam_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-exam_user} -d ${POSTGRES_DB:-exam_app}"
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

    networks:
      - backend

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    
    command: ["server"]

    restart: unless-stopped

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5000

      DATABASE_URL: postgres://${POSTGRES_USER:-exam_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-exam_app}

      # FRONTEND_URL: https://exam-app-client.onrender.com
      FRONTEND_URL: ${FRONTEND_URL}

      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}

      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4.1-mini}
      AI_CHAT_MAX_TOKENS: ${AI_CHAT_MAX_TOKENS:-2000}
      AI_GRADING_MODEL: ${AI_GRADING_MODEL:-openai/gpt-4.1-mini}

      APP_NAME: ${APP_NAME:-Exam App}
      APP_URL: http://localhost:${APP_PORT:-8080}

      REDIS_URL: redis://redis:6379
      AI_GRADING_QUEUE_NAME: ai-written-grading
      
      # SEED_ON_START: true

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully

      seed:
        condition: service_completed_successfully


    volumes:
      - server_uploads:/app/uploads
      - server_outputs:/app/outputs

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:5000/api/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

    networks:
      - backend
      - frontend

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_USE_MOCK: "false"

    restart: unless-stopped

    depends_on:
      server:
        condition: service_healthy

    ports:
      - "${APP_PORT:-8080}:80"

    networks:
      - frontend
  
  migrate:
    build:
      context: ./server
      dockerfile: Dockerfile

    command: ["migrate"]

    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-exam_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-exam_app}

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"

    networks:
      - backend

  seed:
    build:
      context: ./server
      dockerfile: Dockerfile

    command: ["seed"]

    environment:
      NODE_ENV: production

      DATABASE_URL: postgres://${POSTGRES_USER:-exam_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-exam_app}

      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@etest.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin123!}

      SEED_TEACHER_EMAIL: ${SEED_TEACHER_EMAIL:-teacher@etest.com}
      SEED_TEACHER_PASSWORD: ${SEED_TEACHER_PASSWORD:-Teacher123!}

      SEED_STUDENT_EMAIL: ${SEED_STUDENT_EMAIL:-student@etest.com}
      SEED_STUDENT_PASSWORD: ${SEED_STUDENT_PASSWORD:-Student123!}

    depends_on:
      migrate:
        condition: service_completed_successfully

    restart: "no"

    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    ports:
      - "6379:6379"

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s

    networks:
      - backend
    
  queue-test:
    build:
      context: ./server
      dockerfile: Dockerfile.test

    command:
      - npm
      - run
      - test:ai-grading-queue

    environment:
      NODE_ENV: test
      TEST_REDIS_URL: redis://redis:6379
      REDIS_URL: redis://redis:6379
      AI_GRADING_QUEUE_NAME: ai-written-grading-test

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      test-migrate:
        condition: service_completed_successfully

    networks:
      - backend

    profiles:
      - test

  written-ai-queue-test:
    build:
      context: ./server
      dockerfile: Dockerfile.test

    command:
      - npm
      - run
      - test:written-ai-queue

    environment:
      NODE_ENV: test

      DATABASE_URL: postgres://${POSTGRES_USER:-exam_user}:${POSTGRES_PASSWORD}@postgres:5432/exam_app_test

      REDIS_URL: redis://redis:6379
      AI_GRADING_QUEUE_NAME: ai-written-grading-test

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - backend

    profiles:
      - test

  test-migrate:
    build:
      context: ./server
      dockerfile: Dockerfile.test

    command:
      - npm
      - run
      - migrate

    environment:
      NODE_ENV: test

      DATABASE_URL: postgres://${POSTGRES_USER:-exam_user}:${POSTGRES_PASSWORD}@postgres:5432/exam_app_test

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - backend

    profiles:
      - test

  ai-worker:
    build:
      context: ./services/ai-worker
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      NODE_ENV: production

      DATABASE_URL: postgres://${POSTGRES_USER:-exam_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-exam_app}

      REDIS_URL: redis://redis:6379

      AI_GRADING_QUEUE_NAME: ai-written-grading
      AI_WORKER_CONCURRENCY: ${AI_WORKER_CONCURRENCY:-2}

      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      AI_GRADING_MODEL: ${AI_GRADING_MODEL:-openai/gpt-4.1-mini}

      AI_FAKE_GRADING: ${AI_FAKE_GRADING:-false}

      APP_NAME: ${APP_NAME:-Exam App}
      APP_URL: http://localhost:${APP_PORT:-8080}

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully

    networks:
      - backend

volumes:
  postgres_data:
  redis_data:
  server_uploads:
  server_outputs:

networks:
  frontend:
  backend:
    internal: true
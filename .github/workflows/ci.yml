name: Exam App CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    name: Server integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_DB: exam_app_test
          POSTGRES_USER: exam_user
          POSTGRES_PASSWORD: test_database_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U exam_user -d exam_app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

      redis:
        image: redis:7-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15

    env:
      NODE_ENV: test

      DATABASE_URL: >-
        postgres://exam_user:test_database_password@127.0.0.1:5432/exam_app_test

      REDIS_URL: redis://127.0.0.1:6379
      TEST_REDIS_URL: redis://127.0.0.1:6379

      AI_GRADING_QUEUE_NAME: ai-written-grading-test

      JWT_SECRET: github-actions-test-jwt-secret-with-at-least-32-characters
      COOKIE_SECRET: github-actions-test-cookie-secret-with-at-least-32-characters

      OPENROUTER_API_KEY: ""
      E2E_FAKE_AI_GRADING: "true"

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Run database migrations
        run: npm run migrate

      - name: Run server integration tests
        run: npm run test:integration

      - name: Run queue producer test
        run: npm run test:ai-grading-queue

      - name: Run written-answer queue integration test
        run: npm run test:written-ai-queue

  ai-worker-tests:
    name: AI worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: services/ai-worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/ai-worker/package-lock.json

      - name: Install worker dependencies
        run: npm ci

      - name: Run worker tests
        run: npm test

  client-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_BASE_URL: /api
          VITE_USE_MOCK: "false"
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          if-no-files-found: error
          retention-days: 7

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: server
            context: ./server
            dockerfile: ./server/Dockerfile

          - name: client
            context: ./client
            dockerfile: ./client/Dockerfile

          - name: ai-worker
            context: ./services/ai-worker
            dockerfile: ./services/ai-worker/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: exam-app-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  ci-success:
    name: CI successful
    runs-on: ubuntu-latest

    needs:
      - server-tests
      - ai-worker-tests
      - client-build
      - docker-build

    if: always()

    steps:
      - name: Verify required jobs
        run: |
          if [[ "${{ needs.server-tests.result }}" != "success" ]]; then
            echo "Server tests failed."
            exit 1
          fi

          if [[ "${{ needs.ai-worker-tests.result }}" != "success" ]]; then
            echo "AI worker tests failed."
            exit 1
          fi

          if [[ "${{ needs.client-build.result }}" != "success" ]]; then
            echo "Client build failed."
            exit 1
          fi

          if [[ "${{ needs.docker-build.result }}" != "success" ]]; then
            echo "Docker builds failed."
            exit 1
          fi

          echo "All required CI jobs passed."